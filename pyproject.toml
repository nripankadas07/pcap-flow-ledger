[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "pcap-flow-ledger"
version = "0.1.0"
description = "Read bounded classic Ethernet/IPv4 TCP pcaps and summarize directional packet, payload, wire-byte and SYN/FIN/RST counts without outputting payload bytes."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "Dr. Nripanka Das", email = "nripankadas@gmail.com"}]
dependencies = []
[project.scripts]
pcap-flow-ledger = "pcap_flow_ledger:main"
[tool.setuptools]
py-modules = ["pcap_flow_ledger"]
